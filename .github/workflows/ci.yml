name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testbed-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOWORK: "off"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify module files
        run: |
          go mod verify
          go mod tidy -diff
      - name: Run unit tests
        run: go test ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Validate Compose configuration
        run: docker compose --profile all config --quiet

  sql:
    name: SQL environment
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMPOSE_PROJECT_NAME: weave-testbed-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Start SQL services
        run: docker compose --profile sql up --detach --wait --wait-timeout 180
      - name: Check fixture replay
        run: |
          go run ./cmd/testbedctl check --timeout=2m
          go run ./cmd/testbedctl check --timeout=2m
      - name: Verify generated GORM Gen fixture
        run: |
          go generate .
          git diff --exit-code -- internal/gormgenmodel internal/gormgenquery
      - name: Run Adapter demos
        run: |
          go run ./cmd/memory --timeout=2m
          go run ./cmd/gormgen --backend=all --timeout=2m
          go run ./cmd/gorm --backend=all --timeout=2m
          go run ./cmd/goqu --backend=all --timeout=2m
      - name: Run end-to-end match-set matrix
        run: >-
          go test -race -count=1 -tags=integration
          -run '^(TestCanonicalSQLMatchSetMatrix|TestGoqu)' ./integration
      - name: Stop SQL services
        if: always()
        run: docker compose --profile sql down --volumes --remove-orphans

  document:
    name: MongoDB ${{ matrix.mongodb }}
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mongodb: ["mongo:6.0.28", "mongo:8.3.8"]
    env:
      COMPOSE_PROJECT_NAME: weave-document-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
      WEAVE_TESTBED_MONGO_IMAGE: ${{ matrix.mongodb }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Start MongoDB
        run: docker compose --profile document up --detach --wait --wait-timeout 180
      - name: Check MongoDB fixture replay
        run: |
          go run ./cmd/testbedctl check --backend=mongo --timeout=2m
          go run ./cmd/testbedctl check --backend=mongo --timeout=2m
      - name: Run MongoDB Adapter demo
        run: go run ./cmd/mongo --timeout=2m
      - name: Run real MongoDB contract
        run: >-
          go test -race -count=1 -tags=integration
          -run '^TestMongo' ./integration
      - name: Stop MongoDB
        if: always()
        run: docker compose --profile document down --volumes --remove-orphans

  directory:
    name: OpenLDAP 2.6.10
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMPOSE_PROJECT_NAME: weave-directory-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Start OpenLDAP
        run: docker compose --profile directory up --detach --wait --wait-timeout 180
      - name: Verify the OpenLDAP binary version
        run: >-
          docker compose --profile directory exec -T openldap slapd -VV 2>&1 |
          grep -F 'OpenLDAP: slapd 2.6.10'
      - name: Check LDAP fixture replay
        run: |
          go run ./cmd/testbedctl check --backend=ldap --timeout=2m
          go run ./cmd/testbedctl check --backend=ldap --timeout=2m
      - name: Run LDAP Adapter demo
        run: go run ./cmd/ldap --timeout=2m
      - name: Run real LDAP contract
        run: >-
          go test -race -count=1 -tags=integration
          -run '^TestLDAP' ./integration
      - name: Stop OpenLDAP
        if: always()
        run: docker compose --profile directory down --volumes --remove-orphans

  cross-model:
    name: Cross-model match sets
    needs: [sql, document, directory]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMPOSE_PROJECT_NAME: weave-cross-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Start all current services
        run: docker compose --profile all up --detach --wait --wait-timeout 180
      - name: Reset all fixtures
        run: go run ./cmd/testbedctl check --backend=all --timeout=2m
      - name: Compare cross-model match sets
        run: >-
          go test -race -count=1 -tags=integration
          -run '^TestCrossModelMatchSetMatrix$' ./integration
      - name: Stop all services
        if: always()
        run: docker compose --profile all down --volumes --remove-orphans
