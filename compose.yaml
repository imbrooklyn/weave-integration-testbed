name: weave-integration-testbed

services:
  mysql:
    image: mysql:8.0.40
    profiles: [sql, all]
    restart: "no"
    environment:
      MYSQL_DATABASE: "${WEAVE_TESTBED_MYSQL_DATABASE:-weave_testbed}"
      MYSQL_USER: "${WEAVE_TESTBED_MYSQL_USER:-weave}"
      MYSQL_PASSWORD: "${WEAVE_TESTBED_MYSQL_PASSWORD:-weave_demo_only}"
      MYSQL_ROOT_PASSWORD: "${WEAVE_TESTBED_MYSQL_ROOT_PASSWORD:-weave_root_demo_only}"
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${WEAVE_TESTBED_MYSQL_PORT:-33306}:3306"
    volumes:
      - type: bind
        source: ./testdata/mysql
        target: /docker-entrypoint-initdb.d
        read_only: true
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysqladmin ping
          --host=127.0.0.1 --user="$${MYSQL_USER}" --silent &&
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql
          --host=127.0.0.1 --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}" --execute='SELECT 1' --silent
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [sql]

  postgres:
    image: postgres:15.12-alpine
    profiles: [sql, all]
    restart: "no"
    environment:
      POSTGRES_DB: "${WEAVE_TESTBED_POSTGRES_DATABASE:-weave_testbed}"
      POSTGRES_USER: "${WEAVE_TESTBED_POSTGRES_USER:-weave}"
      POSTGRES_PASSWORD: "${WEAVE_TESTBED_POSTGRES_PASSWORD:-weave_demo_only}"
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${WEAVE_TESTBED_POSTGRES_PORT:-35432}:5432"
    volumes:
      - type: bind
        source: ./testdata/postgres
        target: /docker-entrypoint-initdb.d
        read_only: true
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --host=127.0.0.1 --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}" &&
          PGPASSWORD="$${POSTGRES_PASSWORD}" psql
          --host=127.0.0.1 --username="$${POSTGRES_USER}"
          --dbname="$${POSTGRES_DB}" --command='SELECT 1' --quiet
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    networks: [sql]

  mongo:
    image: "${WEAVE_TESTBED_MONGO_IMAGE:-mongo:6.0.28}"
    profiles: [document, all]
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${WEAVE_TESTBED_MONGO_ROOT_USER:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${WEAVE_TESTBED_MONGO_ROOT_PASSWORD:-weave_root_demo_only}"
      MONGO_INITDB_DATABASE: "${WEAVE_TESTBED_MONGO_DATABASE:-weave_testbed}"
      WEAVE_TESTBED_MONGO_USER: "${WEAVE_TESTBED_MONGO_USER:-weave}"
      WEAVE_TESTBED_MONGO_PASSWORD: "${WEAVE_TESTBED_MONGO_PASSWORD:-weave_demo_only}"
      TZ: UTC
    ports:
      - "127.0.0.1:${WEAVE_TESTBED_MONGO_PORT:-37017}:27017"
    volumes:
      - type: bind
        source: ./testdata/mongo
        target: /docker-entrypoint-initdb.d
        read_only: true
    tmpfs:
      - /data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host=127.0.0.1
          --username="$${MONGO_INITDB_ROOT_USERNAME}"
          --password="$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase=admin
          --eval='quit(db.adminCommand({ping: 1}).ok ? 0 : 2)'
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    networks: [document]

  openldap:
    image: "${WEAVE_TESTBED_LDAP_IMAGE:-bitnamilegacy/openldap:2.6.10-debian-12-r4@sha256:966fd39ed25813890e9bd57dac56def163bbcfe64967e0bae59ab018d505bd93}"
    profiles: [directory, all]
    restart: "no"
    environment:
      LDAP_ROOT: "${WEAVE_TESTBED_LDAP_BASE_DN:-dc=weave,dc=test}"
      LDAP_ADMIN_USERNAME: "${WEAVE_TESTBED_LDAP_ADMIN_USER:-admin}"
      LDAP_ADMIN_PASSWORD: "${WEAVE_TESTBED_LDAP_ADMIN_PASSWORD:-weave_demo_only}"
      LDAP_ALLOW_ANON_BINDING: "no"
      LDAP_SKIP_DEFAULT_TREE: "yes"
      LDAP_ADD_SCHEMAS: "yes"
      LDAP_EXTRA_SCHEMAS: "cosine,inetorgperson,nis"
      LDAP_CUSTOM_SCHEMA_DIR: /schemas
      LDAP_CUSTOM_LDIF_DIR: /ldifs
      LDAP_LOGLEVEL: "0"
      TZ: UTC
    ports:
      - "127.0.0.1:${WEAVE_TESTBED_LDAP_PORT:-3389}:1389"
    volumes:
      - type: bind
        source: ./testdata/directory/schema
        target: /schemas
        read_only: true
      - type: bind
        source: ./testdata/directory/ldif
        target: /ldifs
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ldapsearch -x -LLL -H ldap://127.0.0.1:1389
          -D "cn=$${LDAP_ADMIN_USERNAME},$${LDAP_ROOT}"
          -w "$${LDAP_ADMIN_PASSWORD}" -b "$${LDAP_ROOT}" -s base
          '(objectClass=*)' dn >/dev/null
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
    networks: [directory]

  elasticsearch:
    image: "${WEAVE_TESTBED_ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:9.5.2@sha256:9c1e1afc2bda921b35025e21c72ec6e392266995aa35ad6a47887363592718be}"
    profiles: [search, all]
    restart: "no"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      search.allow_expensive_queries: "true"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: UTC
    ports:
      - "127.0.0.1:${WEAVE_TESTBED_ELASTICSEARCH_PORT:-39200}:9200"
    tmpfs:
      - /usr/share/elasticsearch/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent
          'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
          >/dev/null
      interval: 2s
      timeout: 6s
      retries: 90
      start_period: 40s
    networks: [search]

networks:
  sql:
    driver: bridge
  document:
    driver: bridge
  directory:
    driver: bridge
  search:
    driver: bridge
